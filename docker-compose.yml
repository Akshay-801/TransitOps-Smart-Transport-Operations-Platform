version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: transitops-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitops}
      POSTGRES_USER: ${POSTGRES_USER:-transitops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transitops}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: